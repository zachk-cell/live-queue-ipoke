<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Poke Pig Live Queue — Sign in</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1d212b;--line:#272c38;--text:#e8ebf2;--muted:#8b93a7;--accent2:#2b6bff;--danger:#ff5d5d}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;width:min(380px,92vw);text-align:center}
  h1{font-size:19px;margin:0 0 4px}
  p{color:var(--muted);font-size:13px;margin:0 0 22px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:12px}
  button{width:100%;cursor:pointer;border:none;border-radius:10px;font-size:14px;font-weight:700;
    padding:12px;background:var(--accent2);color:#fff}
  .err{color:var(--danger);font-size:13px;margin-bottom:12px;display:none}
  .err.show{display:block}
  .foot{margin-top:18px;font-size:12px;color:var(--muted)}
  .foot a{color:var(--muted)}
</style>
</head>
<body>
  <form class="card" method="POST" action="{{ADMIN}}/login">
    <h1>🎴 Poke Pig Live Queue</h1>
    <p>Control panel — staff only</p>
    <div class="err" id="err">Incorrect password. Try again.</div>
    <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password" />
    <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit authenticator code" />
    <button type="submit">Sign in</button>
    <div class="foot">Buyers: <a href="/">view the public queue →</a></div>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('e')) document.getElementById('err').classList.add('show');
  </script>
</body>
</html>
